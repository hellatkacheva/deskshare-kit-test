<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeskShare</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="banner" class="banner" role="note"></div>
  <header class="header">
    <h1 id="app-name"></h1>
    <button id="names-switch" type="button" role="switch" aria-checked="false" class="switch">
      <span id="names-switch-label"></span> <span id="names-switch-state" class="switch-state"></span>
    </button>
  </header>
  <main>
    <p id="status" class="status" role="alert" hidden></p>
    <section id="book-view">
      <div id="date-strip" class="date-strip" role="group"></div>
      <div id="floor-tabs" class="floor-tabs" role="group"></div>
      <div id="counts" class="counts"></div>
      <p id="floor-full" class="status" role="status" hidden></p>
      <p id="grid-notice" class="notice" hidden></p>
      <div id="grid" class="grid" role="group"></div>
    </section>
  </main>
  <dialog id="dialog" class="dialog"></dialog>
</body>
</html>
