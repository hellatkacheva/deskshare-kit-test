jira:
  project_key: "KAN"
  style: "team-managed"             # team-managed | company-managed
  issue_types:                        # always by ID — names may be localized
    epic: "10003"
    story: "10006"
    task: "10005"
  statuses:                           # filled by jira-sync on first run (needs an issue to read transitions)
    todo: "10006"        # К выполнению (category To Do) — transition 11
    in_progress: "10007" # В работе (category In Progress) — transition 21; "На проверке" 10008 also In Progress, not used
    done: "10009"        # Готово (category Done) — transition 41
  priority_on_create: false           # KAN (team-managed): no priority field on the story create screen
  priority_map: null                  # not used — priority unavailable in KAN
  priority_via_label: true            # (BA) MoSCoW stored as a label instead — BA decision 2026-10-20
  labels:
    project: "deskshare-kit"
    moscow: { Must: must, Should: should, Could: could }

repo:
  url: "https://github.com/hellatkacheva/deskshare-kit-test.git"
  branch: main
  visibility: "public"   # static profile on a free GitHub account needs public

stack:
  deploy:
    profile: static                   # (BA) static (default) | local | cloudflare | none — kit design §3.1
    url: "https://hellatkacheva.github.io/deskshare-kit-test/"  # set by deploy (DEC-033)
    prod_requires_ok: true            # cannot be disabled
  constraints:                        # derived from the profile + project DECs by the spec step
    - "No backend, server, database or third-party store — bookings only in browser localStorage (DEC-001, DEC-014, NFR-005)"
    - "Single-device demo — other employees' bookings are seed data; banner on every screen (DEC-014, ASM-006, REQ-031)"
    - "Plain HTML/CSS/JS ES modules, no framework, no build step; app/public/ published as is"
    - "One storage module, key deskshare-kit:v1, try/catch on every access; unreadable data → read-only, never localStorage.clear() (DEC-031)"
    - "All time rules from one clock in office time UTC+5, fixed offset (DEC-016, ASM-017)"
    - "Test hooks (?now=, ?reset-demo) only on localhost / 127.0.0.1 — off in the deployed build (NFR-010, DEC-031)"
    - "No network request with or after the page load (US-001)"
    - "Re-evaluate on every user action and at least every 60 s while open (DEC-028)"

watch:
  enabled: false                      # (BA) daily GitHub Action → issue "run /ba-sync"
  issue_label: ba-sync
